# ============================================================
#  CONFIG DE TA MARQUE : le seul fichier à remplir
# ============================================================

marque: "Portail Habitat"
site: "https://www.portail-habitat.fr"          # <-- remplace par ta vraie URL
# Adresse publique de TON serveur machine (voir README, étape 5). Sert aux liens envoyés en DM.
url_serveur: "https://machine.portail-habitat.fr"

# Qui tu veux attirer (sois précis : l'IA écrit pour ces gens-là)
cible: >
  Particuliers propriétaires ou futurs propriétaires en France qui ont un projet
  de travaux, rénovation, achat ou aménagement de leur logement, et qui cherchent
  des conseils, des prix et des artisans de confiance.

# Ce que l'inscription gratuite leur apporte (la promesse)
promesse_inscription: >
  Accès gratuit aux guides, estimations de prix et mises en relation avec des
  artisans vérifiés près de chez eux.

langue: "français"

themes:
  - "Prix réels des travaux (combien ça coûte vraiment)"
  - "Erreurs à éviter en rénovation"
  - "Avant / après"
  - "Aides de l'État et économies d'énergie"
  - "Arnaques d'artisans et comment les repérer"
  - "Astuces déco petit budget"
  - "Achat immobilier : pièges et checklists"

reseaux:
  - instagram
  - tiktok
  - facebook
  - linkedin
  - youtube_shorts

posts_par_reseau_par_semaine: 5

# Comptes Instagram PROFESSIONNELS de ta niche à surveiller pour trouver les vidéos qui
# explosent (outliers). Mets-en 10 à 30, français ET américains.
comptes_a_surveiller:
  - "exemple_renovation"
  - "exemple_immo"

# Une vidéo est un « outlier » si elle fait X fois l'engagement habituel du compte
seuil_outlier: 3

# --- Veille tendances & hooks (machine/tendances.py) ---
# Hashtags Instagram à scanner (sans #). Instagram limite à 30 hashtags différents par semaine.
hashtags_a_surveiller:
  - renovation
  - travauxmaison
  - renovationmaison
  - immobilier
  - homedesign
# Recherches YouTube Shorts (France), triées par nombre de vues
recherches_youtube:
  - "rénovation maison"
  - "prix travaux"
  - "erreur rénovation"
  - "achat immobilier conseils"
  - "home renovation hack"

# --- Captures d'écran vidéo du site (machine/ecrans.py) ---
# Chaque page est filmée en format vertical (téléphone) pour servir de plans dans tes vidéos.
# `cliquer` (facultatif) : textes des boutons à cliquer pendant la vidéo, dans l'ordre.
pages_ecran:
  - nom: accueil
    url: "https://www.portail-habitat.fr"
  - nom: inscription
    url: "https://www.portail-habitat.fr/inscription"
  # - nom: recherche-artisan
  #   url: "https://www.portail-habitat.fr/artisans"
  #   cliquer: ["Trouver un artisan"]
