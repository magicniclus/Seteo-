<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompteur</title>
<style>
  :root { --fond: #0f1418; --texte: #f4f1ea; --accent: #2fa37f; }
  body { margin: 0; background: var(--fond); color: var(--texte); font-family: system-ui, sans-serif; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .35; transform: scaleX(-1); }
  #texte { position: relative; padding: 40vh 16px 60vh; max-width: 900px; margin: 0 auto;
           font-size: clamp(28px, 5vw, 52px); line-height: 1.35; white-space: pre-wrap; text-align: center; }
  #barre { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 12px 16px;
           background: rgba(0,0,0,.6); flex-wrap: wrap; align-items: center; z-index: 2; }
  button { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
  #rec.actif { background: #c0392b; }
  label { font-size: 14px; }
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<div id="texte">{{TEXTE}}</div>
<div id="barre">
  <button id="defile">▶ Défiler</button>
  <label>Vitesse <input id="vitesse" type="range" min="1" max="10" value="3"></label>
  <button id="rec">● Enregistrer</button>
  <span id="info"></span>
</div>
<script>
  const camera = document.getElementById("camera");
  let flux, enregistreur, morceaux = [], defilement = null;

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", aspectRatio: 9 / 16 }, audio: true })
    .then(f => { flux = f; camera.srcObject = f; })
    .catch(() => { document.getElementById("info").textContent = "Caméra non autorisée"; });

  document.getElementById("defile").onclick = e => {
    if (defilement) { clearInterval(defilement); defilement = null; e.target.textContent = "▶ Défiler"; return; }
    e.target.textContent = "⏸ Pause";
    defilement = setInterval(() => window.scrollBy(0, +document.getElementById("vitesse").value / 2), 16);
  };

  document.getElementById("rec").onclick = e => {
    if (!flux) return;
    if (enregistreur && enregistreur.state === "recording") { enregistreur.stop(); return; }
    morceaux = [];
    enregistreur = new MediaRecorder(flux);
    enregistreur.ondataavailable = ev => morceaux.push(ev.data);
    enregistreur.onstop = async () => {
      e.target.classList.remove("actif"); e.target.textContent = "● Enregistrer";
      const prise = new Blob(morceaux, { type: enregistreur.mimeType });
      const info = document.getElementById("info");
      info.textContent = "Envoi de la prise...";
      const donnees = new FormData();
      donnees.append("video", prise, "prise.webm");
      try {
        const r = await fetch("{{URL_ENVOI}}", { method: "POST", body: donnees });
        if (!r.ok) throw new Error(r.status);
        info.textContent = "Prise envoyée ✓ (" + (await r.json()).fichier + ")";
      } catch {
        // Si l'envoi échoue, on garde la prise sur l'appareil
        info.textContent = "Envoi impossible : prise téléchargée sur l'appareil";
        const a = document.createElement("a");
        a.href = URL.createObjectURL(prise);
        a.download = "rush-" + Date.now() + ".webm"; a.click();
      }
    };
    enregistreur.start();
    e.target.classList.add("actif"); e.target.textContent = "■ Stop";
    window.scrollTo(0, 0);
    if (!defilement) document.getElementById("defile").click();
  };
</script>
</body>
</html>
